<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FetalAI - Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        form {
            background: white;
            color: black;
            padding: 20px;
            margin: 30px auto;
            width: 50%;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 5px;
        }

        button {
            background: #2a5298;
            color: white;
            padding: 10px 20px;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #1e3c72;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            color: yellow;
        }
    </style>
</head>
<body>

    <h1>FetalAI - Predict Fetal Health</h1>

    <form action="/predict" method="post">

        <!-- Example Inputs (IMPORTANT: match your dataset columns) -->

        <input type="number" step="any" name="baseline value" placeholder="Baseline Value" required>
        <input type="number" step="any" name="accelerations" placeholder="Accelerations" required>
        <input type="number" step="any" name="fetal_movement" placeholder="Fetal Movement" required>
        <input type="number" step="any" name="uterine_contractions" placeholder="Uterine Contractions" required>
        <input type="number" step="any" name="light_decelerations" placeholder="Light Decelerations" required>
        <input type="number" step="any" name="severe_decelerations" placeholder="Severe Decelerations" required>
        <input type="number" step="any" name="prolongued_decelerations" placeholder="Prolongued Decelerations" required>
        <input type="number" step="any" name="abnormal_short_term_variability" placeholder="Abnormal Short Term Variability" required>

        <button type="submit">Predict</button>

    </form>

    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}

</body>
</html>
